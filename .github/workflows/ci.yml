name: CI

on:
  # Test main after every merge, and PRs; branch pushes are covered by their
  # PR, so they don't run twice.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets the Update pixi.lock workflow run tests on its PR (PRs opened with
  # GITHUB_TOKEN don't trigger CI on their own).
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # dev resolves to the newest Python; test-py310 pins the oldest
        # supported one, so both ends of requires-python are covered.
        environment: [dev, test-py310]

    steps:
      - uses: actions/checkout@v7

      # Install from pixi.lock, so the tests run against exactly the locked
      # versions (and a lock refresh PR is actually exercised).
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          environments: ${{ matrix.environment }}
          locked: true

      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} test -v --tb=short