[workspace]
name = "boris-clip"
version = "0.1.0"
channels = ["conda-forge"]
# Keep in step with pixi-version in .github/workflows (CI pins the same pixi).
requires-pixi = ">=0.82.0"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10"
ffmpeg = "*"
pandas = ">=1.5"
click = ">=8.0"

[pypi-dependencies]
boris-clip = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = "*"
pytest-cov = "*"
python-build = ">=1.0"
zensical = ">=0.0.23,<0.0.24"
mkdocstrings = ">=1.0.3,<2"
mkdocstrings-python = ">=2.0.2,<3"

# Pin the oldest supported Python so CI tests both ends of requires-python
# (the dev environment resolves to the newest).
[feature.py310.dependencies]
python = "3.10.*"

[environments]
dev = ["dev"]
test-py310 = ["dev", "py310"]

[feature.dev.tasks]
test = "pytest tests/"
clip = "boris-clip"
build = { cmd = "python -m build", description = "Build sdist + wheel into ./dist/" }
docs-build = { cmd = "zensical build", description = "Build the static docs site into ./site/." }
